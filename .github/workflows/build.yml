name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check that the tag is v and VersionPrefix
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $prefix = @($props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ })[0]
          if ('${{ github.ref_name }}' -ne "v$prefix") {
            Write-Error "The tag ${{ github.ref_name }} is not v$prefix."
            exit 1
          }

      - name: Unit tests with coverage
        run: ./coverage.ps1

      - name: Pack with a CI version suffix
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./pack.ps1 -VersionSuffix ci.${{ github.run_number }}

      - name: Pack the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./pack.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the packages and the symbol packages to nuget.org
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
