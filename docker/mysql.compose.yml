# Local MySQL for the EF Core integration tests.
# Put MYSQL_ROOT_PASSWORD=<password> into docker/.env (git ignores it), then run from the repository root:
#   docker compose -f docker/mysql.compose.yml up -d
# Connection string: Server=127.0.0.1;Port=3306;User ID=root;Password=<password>
# Use 127.0.0.1, not localhost: the port listens only on IPv4, and Windows needs about 2 seconds to refuse ::1.
name: msghatch-mysql

services:
  dev-mysql:
    image: mysql:8.4
    container_name: dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dev-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  dev-mysql-data:
